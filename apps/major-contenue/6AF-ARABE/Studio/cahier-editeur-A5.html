<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Éditeur Cahier Major A5</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════
   DESIGN TOKENS
══════════════════════════════════════════ */
:root{
  --navy:#182b66; --royal:#2563eb; --sky:#38bdf8;
  --gold:#fde68a; --gold-dk:#F0B429; --green:#059669;
  --bg:#d8e0ee; --ink:#0f172a; --muted:#64748b; --border:#e2e8f0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit;cursor:pointer}
input,textarea,select{cursor:text}

/* ══════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════ */
.app{
  height:100vh;
  display:grid;
  grid-template-rows:52px 1fr;
  grid-template-columns:256px 1fr 280px;
  grid-template-areas:"nav nav nav" "left canvas right";
}

/* ── NAVBAR ── */
.nav{
  grid-area:nav;
  background:linear-gradient(135deg,var(--navy) 0%,var(--royal) 55%,var(--sky) 100%);
  display:flex;align-items:center;padding:0 16px;gap:10px;
  box-shadow:0 2px 16px rgba(24,43,102,.35);z-index:100;
}
.nav-brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.nav-logo{
  width:34px;height:34px;border-radius:10px;
  background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.3);
  display:grid;place-items:center;font-size:15px;font-weight:900;color:var(--gold);
}
.nav-title strong{display:block;font-size:14px;font-weight:900;color:#fff}
.nav-title span{display:block;font-size:10px;color:rgba(255,255,255,.65)}
.nav-sep{width:1px;height:28px;background:rgba(255,255,255,.2);flex-shrink:0}
.nav-center{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
.nav-page-label{font-size:12px;font-weight:700;color:#fff;min-width:90px;text-align:center;opacity:.9}
.nav-arrow{
  width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;
}
.nav-arrow:hover{background:rgba(255,255,255,.24)}
.nav-arrow:disabled{opacity:.3;cursor:default}
.nav-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.nav-zoom{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  border-radius:999px;padding:4px 10px;
}
.nav-zoom span{font-size:11px;color:#fff;font-weight:700;min-width:36px;text-align:center}
.nav-zoom button{
  width:22px;height:22px;border-radius:50%;border:none;
  background:rgba(255,255,255,.18);color:#fff;font-size:14px;font-weight:700;
  display:grid;place-items:center;line-height:1;
}
.nav-zoom button:hover{background:rgba(255,255,255,.32)}
.btn-print{
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,var(--gold-dk),#fb923c);
  border:none;border-radius:999px;padding:7px 16px;
  font-size:12px;font-weight:800;color:var(--ink);
  box-shadow:0 2px 10px rgba(240,180,41,.4);transition:transform .12s;
}
.btn-print:hover{transform:translateY(-1px)}

/* ── LEFT PANEL ── */
.left{
  grid-area:left;
  background:rgba(255,255,255,.97);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.panel-hd{
  padding:12px 14px 8px;border-bottom:1px solid var(--border);
}
.panel-hd-label{
  font-size:10px;font-weight:800;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:block;
}
.page-list{display:flex;flex-direction:column;gap:5px;overflow-y:auto;padding:10px 14px;flex:0 0 auto;max-height:180px}
.page-list::-webkit-scrollbar{width:4px}
.page-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.pg-item{
  display:flex;align-items:center;gap:8px;
  border:1.5px solid var(--border);border-radius:12px;
  background:#fff;padding:7px 10px;text-align:left;transition:border-color .12s;
}
.pg-item:hover{border-color:var(--royal)}
.pg-item.active{border-color:var(--royal);background:#eff6ff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.pg-mini{width:24px;height:32px;border-radius:3px;overflow:hidden;border:1px solid #d1d5db;flex-shrink:0}
.pg-mini-hd{height:9px;background:linear-gradient(135deg,var(--navy),var(--royal))}
.pg-mini-bd{height:23px;background:#fffaf0;padding:2px;display:flex;flex-direction:column;gap:2px}
.pg-mini-bd i{display:block;height:2px;border-radius:1px;background:#dbeafe}
.pg-info{flex:1;min-width:0;text-align:left}
.pg-info strong{display:block;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-info small{display:block;font-size:9px;color:var(--muted)}
.pg-num{font-size:10px;font-weight:800;color:var(--muted);background:var(--bg);border-radius:5px;padding:2px 5px}
.pg-item.active .pg-num{background:var(--royal);color:#fff}

.btn-add-page{
  margin:0 14px 8px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(135deg,var(--navy),var(--royal));
  border:none;border-radius:999px;padding:8px 14px;
  font-size:12px;font-weight:800;color:#fff;
  box-shadow:0 3px 10px rgba(37,99,235,.3);transition:transform .12s;
}
.btn-add-page:hover{transform:translateY(-1px)}

.lib-hd{
  padding:8px 14px 6px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;
}
.lib-list{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:5px}
.lib-list::-webkit-scrollbar{width:4px}
.lib-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.lib-btn{
  display:flex;align-items:center;gap:10px;
  border:1.5px solid var(--border);border-radius:10px;
  background:#fff;padding:9px 11px;text-align:left;transition:all .12s;
}
.lib-btn:hover{border-color:var(--royal);box-shadow:0 4px 14px rgba(37,99,235,.12);transform:translateX(2px)}
.lib-ico{
  width:32px;height:32px;border-radius:8px;
  display:grid;place-items:center;font-size:16px;flex-shrink:0;
}
.lib-btn strong{display:block;font-size:12px;font-weight:800}
.lib-btn span{display:block;font-size:10px;color:var(--muted)}

/* ── CANVAS ── */
.canvas-area{
  grid-area:canvas;overflow:auto;
  display:flex;align-items:flex-start;justify-content:center;
  padding:28px 20px;
  background:radial-gradient(circle at 20% 20%,rgba(37,99,235,.05),transparent 50%),
             radial-gradient(circle at 80% 80%,rgba(56,189,248,.05),transparent 50%),#d0d8ee;
}
.canvas-area::before{
  content:"";position:fixed;inset:0;
  background-image:radial-gradient(circle,rgba(37,99,235,.06) 1px,transparent 1px);
  background-size:24px 24px;pointer-events:none;z-index:0;
}

/* ── RIGHT PANEL ── */
.right{
  grid-area:right;
  background:rgba(255,255,255,.97);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.right-tabs{display:flex;border-bottom:1px solid var(--border)}
.rtab{
  flex:1;padding:13px 4px;border:none;background:transparent;
  font-size:11px;font-weight:700;color:var(--muted);
  border-bottom:2.5px solid transparent;transition:all .12s;
}
.rtab.active{color:var(--royal);border-bottom-color:var(--royal)}
.right-body{flex:1;overflow-y:auto;padding:14px}
.right-body::-webkit-scrollbar{width:4px}
.right-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;font-weight:700;color:#334155;margin-bottom:4px}
.field input,.field textarea,.field select{
  width:100%;border:1.5px solid var(--border);border-radius:8px;
  background:#fff;padding:8px 10px;font-size:12px;outline:none;
}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:var(--royal);box-shadow:0 0 0 3px rgba(37,99,235,.1);
}
.field textarea{min-height:60px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.theme-row{display:flex;gap:6px;flex-wrap:wrap}
.theme-dot{
  flex:1;height:34px;border-radius:8px;border:2.5px solid transparent;
  font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);
  transition:transform .12s,border-color .12s;
}
.theme-dot:hover{transform:translateY(-2px)}
.theme-dot.active{border-color:var(--gold-dk);box-shadow:0 0 0 3px rgba(240,180,41,.2)}
.sec-label-right{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px}
.no-sel{text-align:center;padding:32px 16px;color:var(--muted)}
.no-sel .ico{font-size:32px;opacity:.4;margin-bottom:8px}
.no-sel p{font-size:12px;line-height:1.5}
.action-row{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  border-radius:8px;padding:7px 11px;font-size:11px;font-weight:700;
  border:1.5px solid var(--border);background:#fff;color:var(--ink);transition:all .12s;
}
.btn:hover{background:var(--bg);border-color:var(--royal)}
.btn.danger{background:#fff1f2;border-color:#fecdd3;color:#be123c}
.btn.danger:hover{background:#ffe4e6}
.btn.primary{background:var(--royal);border-color:var(--royal);color:#fff}
.btn.primary:hover{background:#1d4ed8}

/* ══════════════════════════════════════════
   PAGE A5 — Style V3-Cartoon
══════════════════════════════════════════ */
.page{
  width:148mm;height:210mm;
  position:relative;overflow:hidden;
  background:#FAF6EE;
  box-shadow:0 24px 80px rgba(15,23,42,.4),0 4px 16px rgba(15,23,42,.2);
  transform-origin:top left;border-radius:3px;flex-shrink:0;z-index:1;
  font-family:'Cairo',sans-serif;direction:rtl;
}
.page.theme-blue {--th-deep:#1e3a5f;--th-accent:#2563eb;--th-light:#38bdf8}
.page.theme-green{--th-deep:#064e3b;--th-accent:#059669;--th-light:#34d399}
.page.theme-purple{--th-deep:#312e81;--th-accent:#7c3aed;--th-light:#22d3ee}
.page.theme-orange{--th-deep:#7c2d12;--th-accent:#ea580c;--th-light:#fb923c}

/* Blobs */
.page-blobs{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:0}

/* Spirale */
.spiral{
  position:absolute;top:0;right:0;bottom:0;width:18mm;z-index:20;pointer-events:none;
  background:url('assets/major-page-style/spiral-binding.png') repeat-y right top / 18mm auto;
}

/* Header */
.page-header{
  position:absolute;top:0;left:0;right:0;height:23mm;
  background:linear-gradient(135deg,var(--th-deep),var(--th-accent) 60%,var(--th-light));
  border-bottom:3px solid #111;box-shadow:0 4px 0 rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18mm 0 8mm;color:#fff;z-index:2;
}
.page-header strong{display:block;font-size:13px;font-weight:900}
.page-header span{display:block;font-size:7.5px;color:#BFDBFE;margin-top:2px}
.page-mascot{width:14mm;height:14mm;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:18px}

/* Safe zone guide */
.safe-zone{
  position:absolute;left:5mm;right:17mm;top:27mm;bottom:22mm;
  border:1px dashed rgba(37,99,235,.15);border-radius:8px;pointer-events:none;z-index:1;
}

/* QR Footer */
.qr-footer{
  position:absolute;left:0;right:0;bottom:0;height:20mm;
  background:linear-gradient(135deg,#064e3b,#059669);
  border:2.5px solid #111;border-radius:14px 14px 0 0;
  box-shadow:3px 3px 0 #111;
  display:flex;align-items:center;gap:8px;padding:0 6mm;
  color:#D1FAE5;z-index:40;overflow:hidden;
}
.qr-footer::before{
  content:"";position:absolute;inset:0;
  background:url('assets/major-page-style/resources-footer.png') no-repeat center/cover;
  opacity:.18;pointer-events:none;
}
.qr-footer>*{position:relative;z-index:1}
.qr-box{width:13mm;height:13mm;background:#fff;border-radius:5px;display:grid;place-items:center;font-size:7px;font-weight:900;color:#059669;flex-shrink:0}
.qr-text{flex:1;text-align:right;font-size:7.5px;line-height:1.4}
.qr-text strong{display:block;font-size:9px;font-weight:900;color:#fff}
.qr-page{font-size:8px;font-weight:900;color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:2px 7px;background:rgba(255,255,255,.1);flex-shrink:0}

/* ══════════════════════════════════════════
   BLOCS ÉDITABLES — Style V3-Cartoon
══════════════════════════════════════════ */
.edit-area{
  position:absolute;left:0;right:0;top:23mm;bottom:20mm;
  z-index:10;
}

.block-wrap{
  position:absolute;cursor:move;
  user-select:none;
}
.block-wrap:focus{outline:none}
.block-wrap.selected>.block-inner{
  outline:3px solid var(--gold-dk);outline-offset:2px;
}
.block-inner{height:100%;width:100%;overflow:hidden;direction:rtl;font-family:'Cairo',sans-serif}

/* Resize handle */
.resize-handle{
  position:absolute;width:14px;height:14px;right:-5px;bottom:-5px;
  border-radius:4px;background:var(--gold-dk);border:2px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:nwse-resize;z-index:100;
}

/* ── Section Badge ── */
.sec-pill-wrap{padding:4px 0}
.sec-pill{
  background-image:url('assets/major-page-style/lesson-header-badge.png');
  background-size:100% 100%;background-repeat:no-repeat;
  border-radius:12px;padding:8px 36px 8px 20px;min-height:38px;
  display:inline-flex;align-items:center;color:#fff;
  font-size:12px;font-weight:900;font-style:italic;
  text-shadow:0 1px 3px rgba(0,0,0,.3);width:100%;direction:rtl;
}

/* ── Règle ── */
.qaaida-box{
  background:linear-gradient(135deg,#EEF2FF,#DBEAFE);
  border:2px solid #93C5FD;border-right:5px solid #2563eb;
  border-radius:14px;padding:8px 12px;height:100%;
  position:relative;overflow:hidden;direction:rtl;
}
.qaaida-box::after{
  content:"";position:absolute;inset:0;
  background:url('assets/major-page-style/rule-reminder-box.png') no-repeat center/100% 100%;
  opacity:.10;pointer-events:none;border-radius:12px;z-index:0;
}
.qaaida-title,.qaaida-text{position:relative;z-index:1}
.qaaida-title{font-size:13px;font-weight:900;color:#2563eb;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.qaaida-text{font-size:10px;font-weight:700;color:#1e3a5f;line-height:1.7}
.qaaida-text .hl{background:#DBEAFE;border-radius:4px;padding:0 4px;color:#1e40af}

/* ── Exercice ── */
.exo-card{
  background:#fff;
  border:2.5px solid #111;border-radius:14px;
  box-shadow:3px 3px 0 #111;
  padding:7px 10px;height:100%;
  position:relative;overflow:hidden;direction:rtl;
}
.exo-card::before{
  content:"";position:absolute;inset:0;
  background:url('assets/major-page-style/exercise-cards.png') no-repeat right bottom/60% auto;
  opacity:.07;pointer-events:none;border-radius:14px;z-index:0;
}
.exo-card>*{position:relative;z-index:1}
.exo-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.exo-circle{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,#2563eb,#38bdf8);
  border:2px solid #111;box-shadow:2px 2px 0 #111;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:900;color:#fff;flex-shrink:0;
}
.exo-level{font-size:8px;font-weight:900;padding:2px 8px;border-radius:999px;background:#f0fdf4;color:#15803d}
.exo-pts{font-size:8px;font-weight:900;color:#94a3b8}
.exo-instr{font-size:10px;font-weight:700;line-height:1.5;color:#0f172a;margin-bottom:5px}
.exo-example{
  background:#EEF2FF;border:2px solid #93C5FD;border-radius:8px;
  padding:3px 7px;margin-bottom:5px;font-size:8.5px;font-weight:700;color:#1e40af;
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
}
.fill-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.fill-item{
  border:1.5px solid #93C5FD;border-right:4px solid #2563eb;
  border-radius:8px;padding:4px 6px;background:#fff;
  box-shadow:2px 2px 0 rgba(37,99,235,.1);
  display:flex;align-items:center;gap:4px;
}
.fill-index{
  width:18px;height:18px;border-radius:50%;
  background:linear-gradient(135deg,#2563eb,#38bdf8);
  color:#fff;font-size:8px;font-weight:900;
  display:grid;place-items:center;flex-shrink:0;
}
.fill-word{font-size:9px;font-weight:800;color:#1e3a5f}
.fill-line{flex:1;height:14px;border-bottom:1.5px dashed #93C5FD}
.answer-line{height:18px;border-bottom:1.8px dashed #93C5FD;margin-bottom:4px}

/* ── Tableau ── */
.table-block{height:100%;direction:rtl}
.table-block h3{font-size:9px;font-weight:900;margin-bottom:6px;color:#0f172a}
.ex-table{width:100%;border-collapse:collapse;font-size:9px}
.ex-table th{background:#2563eb;color:#fff;padding:4px;border:1.5px solid #111;font-weight:900}
.ex-table td{border:1.5px solid #93C5FD;padding:3px;height:11mm;vertical-align:middle}

/* ── Rédaction ── */
.writing-block{height:100%;direction:rtl}
.writing-block h3{font-size:9px;font-weight:900;margin-bottom:6px;color:#0f172a}
.writing-lines{display:flex;flex-direction:column;gap:4px;flex:1}
.writing-lines i{display:block;height:10mm;border-bottom:1.8px dashed #93C5FD}

/* ── Sélection highlight ── */
.block-wrap.selected{z-index:50!important}

/* ══════════════════════════════════════════
   PRINT
══════════════════════════════════════════ */
@media print{
  html,body{height:auto;overflow:visible}
  .nav,.left,.right,.safe-zone,.resize-handle{display:none!important}
  .canvas-area{display:block;padding:0;background:white;overflow:visible}
  .canvas-area::before{display:none}
  .page{
    box-shadow:none!important;transform:none!important;
    border-radius:0;page-break-after:always;
    margin:0!important;
  }
  .block-wrap{outline:none!important}
  @page{size:A5 portrait;margin:0}
}
</style>
</head>
<body>

<div class="app">

<!-- ── NAVBAR ── -->
<nav class="nav">
  <div class="nav-brand">
    <div class="nav-logo">M+</div>
    <div class="nav-title">
      <strong>Cahier Studio A5</strong>
      <span>Éditeur drag &amp; drop — Major 6AF</span>
    </div>
  </div>
  <div class="nav-sep"></div>
  <div class="nav-center">
    <button class="nav-arrow" id="btnPrev" onclick="goPage(-1)">&#10095;</button>
    <span class="nav-page-label" id="pgLabel">Page 1 · 1/1</span>
    <button class="nav-arrow" id="btnNext" onclick="goPage(1)">&#10094;</button>
  </div>
  <div class="nav-sep"></div>
  <div class="nav-actions">
    <div class="nav-zoom">
      <button onclick="setZoom(zoom-0.08)">&#8722;</button>
      <span id="zoomLabel">82%</span>
      <button onclick="setZoom(zoom+0.08)">&#43;</button>
    </div>
    <button class="btn-print" onclick="window.print()">&#128424; Imprimer A5</button>
  </div>
</nav>

<!-- ── LEFT PANEL ── -->
<aside class="left">
  <div class="panel-hd">
    <span class="panel-hd-label">Pages</span>
    <button class="btn-add-page" onclick="addPage()">&#43; Nouvelle page</button>
    <div class="page-list" id="pageList"></div>
  </div>
  <div class="lib-hd">Bibliothèque de blocs</div>
  <div class="lib-list" id="libList"></div>
</aside>

<!-- ── CANVAS ── -->
<main class="canvas-area" id="canvasArea">
  <div class="page theme-blue" id="pageEl">
    <div class="page-blobs" aria-hidden="true">
      <svg width="90" height="90" viewBox="0 0 90 90" style="position:absolute;top:-15px;right:-15px">
        <ellipse cx="30" cy="60" rx="40" ry="32" fill="#2563eb18" transform="rotate(-30 30 60)"/>
        <circle cx="70" cy="20" r="18" fill="#2563eb10"/>
      </svg>
    </div>
    <div class="spiral" aria-hidden="true"></div>
    <header class="page-header" id="pageHeader">
      <div><strong>Major 6AF ✦</strong><span id="lessonLabel">اللغة العربية — النحو</span></div>
      <div class="page-mascot">🐪</div>
    </header>
    <div class="safe-zone"></div>
    <div class="edit-area" id="editArea"></div>
    <footer class="qr-footer">
      <div class="qr-box">QR</div>
      <div class="qr-text"><strong>📷 امسح الرمز بهاتفك</strong><span id="footerLabel">Major 6AF · دفتر التمارين</span></div>
      <em class="qr-page" id="pageNumLabel">1 / 1</em>
    </footer>
  </div>
</main>

<!-- ── RIGHT PANEL ── -->
<aside class="right">
  <div class="right-tabs">
    <button class="rtab active" id="tabPage" onclick="switchTab('page')">📄 Page</button>
    <button class="rtab" id="tabBlock" onclick="switchTab('block')">✏️ Bloc</button>
  </div>
  <div class="right-body" id="rightBody">
    <!-- Page tab content -->
    <div id="pageTab">
      <p class="sec-label-right">Infos de la page</p>
      <div class="field"><label>Titre</label><input id="pgTitle" oninput="updatePageProp('title',this.value)"/></div>
      <div class="field"><label>Leçon / matière</label><input id="pgLesson" oninput="updatePageProp('lesson',this.value)"/></div>
      <div class="field"><label>Texte footer QR</label><input id="pgFooter" oninput="updatePageProp('footer',this.value)"/></div>
      <p class="sec-label-right">Thème couleur</p>
      <div class="theme-row">
        <button class="theme-dot active" style="background:linear-gradient(135deg,#1e3a5f,#2563eb,#38bdf8)" onclick="setTheme('blue')" title="Arabe Bleu">Ara</button>
        <button class="theme-dot" style="background:linear-gradient(135deg,#064e3b,#059669,#34d399)" onclick="setTheme('green')" title="Islamique Vert">Isl</button>
        <button class="theme-dot" style="background:linear-gradient(135deg,#312e81,#7c3aed,#22d3ee)" onclick="setTheme('purple')" title="Moderne">Mod</button>
        <button class="theme-dot" style="background:linear-gradient(135deg,#7c2d12,#ea580c,#fb923c)" onclick="setTheme('orange')" title="Maths">Mat</button>
      </div>
    </div>
    <!-- Block tab content -->
    <div id="blockTab" style="display:none">
      <div class="no-sel" id="noSel"><div class="ico">✦</div><p>Clique sur un bloc pour l'éditer.</p></div>
      <div id="blockEditor" style="display:none">
        <p class="sec-label-right">Contenu</p>
        <div class="field"><label>Titre / consigne</label><input id="bTitle" oninput="updateBlockProp('title',this.value)"/></div>
        <div class="field"><label>Texte / exemple</label><textarea id="bText" oninput="updateBlockProp('text',this.value)"></textarea></div>
        <p class="sec-label-right">Position & taille (mm)</p>
        <div class="grid2">
          <div class="field"><label>X</label><input type="number" id="bX" oninput="updateBlockProp('x',+this.value)"/></div>
          <div class="field"><label>Y</label><input type="number" id="bY" oninput="updateBlockProp('y',+this.value)"/></div>
          <div class="field"><label>Largeur</label><input type="number" id="bW" oninput="updateBlockProp('w',+this.value)"/></div>
          <div class="field"><label>Hauteur</label><input type="number" id="bH" oninput="updateBlockProp('h',+this.value)"/></div>
        </div>
        <div class="action-row">
          <button class="btn" onclick="duplicateBlock()">📋 Dupliquer</button>
          <button class="btn danger" onclick="deleteBlock()">🗑 Supprimer</button>
        </div>
      </div>
    </div>
  </div>
</aside>

</div><!-- end .app -->

<script>
/* ════════════════════════════════════════════
   STATE
════════════════════════════════════════════ */
let uid = () => Math.random().toString(36).slice(2,9);
let clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
let zoom = 0.82;
let currentPageIdx = 0;
let selectedBlockId = null;
let activeTab = 'page';

// Pages state
let pages = [mkPage(0)];

function mkPage(idx){
  return {
    id: uid(),
    title: `Page ${idx+1}`,
    lesson: 'اللغة العربية — النحو',
    footer: 'Major 6AF · دفتر التمارين',
    theme: 'blue',
    blocks: []
  };
}

function curPage(){ return pages[currentPageIdx]; }

/* ════════════════════════════════════════════
   BLOCK TEMPLATES
════════════════════════════════════════════ */
const LIBRARY = [
  {
    key:'section', icon:'🏷️', label:'Titre de section', sub:'Badge décoratif',
    color:'linear-gradient(135deg,#1e3a5f,#2563eb)',
    def:{ w:120, h:13, x:6, y:3 }
  },
  {
    key:'rule', icon:'📌', label:'Règle / leçon', sub:'Encadré pédagogique',
    color:'linear-gradient(135deg,#1d4ed8,#38bdf8)',
    def:{ w:128, h:20, x:6, y:3 }
  },
  {
    key:'exercise', icon:'✏️', label:'Exercice ×2 colonnes', sub:'Grille 2 cols',
    color:'linear-gradient(135deg,#059669,#34d399)',
    def:{ w:60, h:55, x:6, y:3 }
  },
  {
    key:'wide', icon:'📋', label:'Exercice large', sub:'Pleine largeur',
    color:'linear-gradient(135deg,#7c3aed,#22d3ee)',
    def:{ w:128, h:55, x:6, y:3 }
  },
  {
    key:'table', icon:'📊', label:'Tableau', sub:'Colonnes réponses',
    color:'linear-gradient(135deg,#ea580c,#fb923c)',
    def:{ w:128, h:50, x:6, y:3 }
  },
  {
    key:'writing', icon:'📝', label:'Rédaction', sub:'Lignes libres',
    color:'linear-gradient(135deg,#0f172a,#475569)',
    def:{ w:128, h:38, x:6, y:3 }
  },
];

function mkBlock(key){
  let tpl = LIBRARY.find(l=>l.key===key);
  let pg  = curPage();
  // Trouver la position Y libre
  let maxY = 3;
  pg.blocks.forEach(b => { maxY = Math.max(maxY, b.y + b.h + 3); });
  return {
    id: uid(), type: key,
    title: blockDefaultTitle(key),
    text:  blockDefaultText(key),
    x: tpl.def.x, y: maxY,
    w: tpl.def.w, h: tpl.def.h,
  };
}

function blockDefaultTitle(key){
  return {
    section:'✎ عنوان القسم',
    rule:'القاعدة',
    exercise:'أعرب الكلمات التي تحتها خط :',
    wide:'أكمل الجدول بما يناسب :',
    table:'أكمل الجدول :',
    writing:'ركّب جملة مفيدة :',
  }[key] || '';
}
function blockDefaultText(key){
  return {
    rule:'اكتب هنا قاعدة الدرس بشكل مختصر وواضح.',
    exercise:'مثال: الجهلُ ظلامٌ — الجهلُ: مبتدأ مرفوع.',
  }[key] || '';
}

/* ════════════════════════════════════════════
   RENDER
════════════════════════════════════════════ */
function mmPx(mm){ return mm * 3.7795; } // 1mm = 3.7795px at 96dpi

function renderBlock(block){
  let el = document.createElement('div');
  el.className = 'block-wrap' + (block.id===selectedBlockId?' selected':'');
  el.dataset.id = block.id;
  el.style.cssText = `left:${block.x}mm;top:${block.y}mm;width:${block.w}mm;height:${block.h}mm;`;

  let inner = document.createElement('div');
  inner.className = 'block-inner';
  inner.innerHTML = blockHTML(block);
  el.appendChild(inner);

  let rz = document.createElement('span');
  rz.className = 'resize-handle';
  el.appendChild(rz);

  // Drag to move
  el.addEventListener('pointerdown', e => {
    if(e.target.classList.contains('resize-handle')) return;
    e.stopPropagation();
    selectBlock(block.id);
    startDrag(e, block, 'move');
  });
  // Drag to resize
  rz.addEventListener('pointerdown', e => {
    e.stopPropagation();
    startDrag(e, block, 'resize');
  });

  return el;
}

function blockHTML(block){
  const {type,title,text} = block;
  if(type === 'section') return `
    <div class="sec-pill-wrap">
      <div class="sec-pill">${title}</div>
    </div>`;

  if(type === 'rule') return `
    <div class="qaaida-box">
      <div class="qaaida-title">📌 ${title}</div>
      <div class="qaaida-text">${text}</div>
    </div>`;

  if(type === 'exercise') return `
    <div class="exo-card">
      <div class="exo-head">
        <div style="display:flex;align-items:center;gap:5px;direction:rtl">
          <span class="exo-circle">✎</span>
          <span style="background:#2563eb;color:#fff;border:2px solid #111;box-shadow:2px 2px 0 #111;border-radius:999px;padding:2px 8px;font-size:7.5px;font-weight:900">تمرين</span>
          <span style="color:#2563eb;font-size:9px;font-weight:900">◀</span>
          <span class="exo-level">⭐ سهل</span>
        </div>
        <span class="exo-pts">4 نقاط</span>
      </div>
      <div class="exo-instr">${title}</div>
      ${text ? `<div class="exo-example">${text}</div>` : ''}
      <div class="fill-grid">
        ${[1,2,3,4].map(n=>`
        <div class="fill-item">
          <span class="fill-index">${n}</span>
          <span class="fill-word">عنصر ${n}</span>
          <div class="fill-line"></div>
        </div>`).join('')}
      </div>
    </div>`;

  if(type === 'wide') return `
    <div class="exo-card" style="width:100%">
      <div class="exo-head">
        <div style="display:flex;align-items:center;gap:5px;direction:rtl">
          <span class="exo-circle">✎</span>
          <span style="background:#2563eb;color:#fff;border:2px solid #111;box-shadow:2px 2px 0 #111;border-radius:999px;padding:2px 8px;font-size:7.5px;font-weight:900">تمرين</span>
        </div>
        <span class="exo-pts">4 نقاط</span>
      </div>
      <div class="exo-instr">${title}</div>
      ${text ? `<div class="exo-example">${text}</div>` : ''}
      ${[1,2,3,4,5,6].map(n=>`<div class="answer-line" style="margin-bottom:5px"></div>`).join('')}
    </div>`;

  if(type === 'table') return `
    <div class="table-block">
      <h3>${title}</h3>
      <table class="ex-table">
        <thead><tr><th>المفرد</th><th>جمع المذكر</th><th>جمع المؤنث</th></tr></thead>
        <tbody>
          ${[1,2,3,4].map(()=>'<tr><td></td><td></td><td></td></tr>').join('')}
        </tbody>
      </table>
    </div>`;

  if(type === 'writing') return `
    <div class="writing-block">
      <h3>${title}</h3>
      <div class="writing-lines">
        ${[1,2,3].map(()=>'<i></i>').join('')}
      </div>
    </div>`;

  return `<div>${title}</div>`;
}

function renderPage(){
  let pg = curPage();
  let area = document.getElementById('editArea');
  area.innerHTML = '';
  pg.blocks.forEach(b => area.appendChild(renderBlock(b)));

  // Header
  document.getElementById('lessonLabel').textContent = pg.lesson;
  document.getElementById('footerLabel').textContent = pg.footer;
  document.getElementById('pageNumLabel').textContent = `${currentPageIdx+1} / ${pages.length}`;

  // Theme
  let pageEl = document.getElementById('pageEl');
  pageEl.className = `page theme-${pg.theme}`;

  // Apply zoom
  pageEl.style.transform = `scale(${zoom})`;

  // Page list
  renderPageList();

  // Right panel page fields
  document.getElementById('pgTitle').value  = pg.title;
  document.getElementById('pgLesson').value = pg.lesson;
  document.getElementById('pgFooter').value = pg.footer;

  // Theme buttons active state
  document.querySelectorAll('.theme-dot').forEach(d=>{
    d.classList.toggle('active', d.title.toLowerCase().includes(pg.theme) ||
      (pg.theme==='blue'&&d.title.includes('Arabe')) ||
      (pg.theme==='green'&&d.title.includes('Islamique')) ||
      (pg.theme==='purple'&&d.title.includes('Moderne')) ||
      (pg.theme==='orange'&&d.title.includes('Maths')));
  });

  // Zoom label
  document.getElementById('zoomLabel').textContent = Math.round(zoom*100)+'%';

  // Nav buttons
  document.getElementById('pgLabel').textContent = `${pg.title} · ${currentPageIdx+1}/${pages.length}`;
  document.getElementById('btnPrev').disabled = currentPageIdx === 0;
  document.getElementById('btnNext').disabled = currentPageIdx === pages.length-1;

  // Refresh block editor
  updateBlockEditor();
}

function renderPageList(){
  let list = document.getElementById('pageList');
  list.innerHTML = '';
  pages.forEach((pg,i) => {
    let btn = document.createElement('button');
    btn.className = 'pg-item' + (i===currentPageIdx?' active':'');
    btn.innerHTML = `
      <div class="pg-mini"><div class="pg-mini-hd"></div><div class="pg-mini-bd"><i></i><i></i><i></i></div></div>
      <div class="pg-info"><strong>${pg.title}</strong><small>${pg.blocks.length} bloc${pg.blocks.length!==1?'s':''}</small></div>
      <span class="pg-num">${String(i+1).padStart(2,'0')}</span>`;
    btn.onclick = () => { currentPageIdx=i; selectedBlockId=null; renderPage(); };
    list.appendChild(btn);
  });
}

function renderLibrary(){
  let list = document.getElementById('libList');
  list.innerHTML = '';
  LIBRARY.forEach(item => {
    let btn = document.createElement('button');
    btn.className = 'lib-btn';
    btn.innerHTML = `
      <div class="lib-ico" style="background:${item.color}">${item.icon}</div>
      <div><strong>${item.label}</strong><span>${item.sub}</span></div>`;
    btn.onclick = () => addBlock(item.key);
    list.appendChild(btn);
  });
}

/* ════════════════════════════════════════════
   DRAG & RESIZE
════════════════════════════════════════════ */
function startDrag(e, block, mode){
  e.preventDefault();
  let pageEl = document.getElementById('pageEl');
  let rect   = pageEl.getBoundingClientRect();
  let ratio  = 148 / rect.width; // mm per pixel (unscaled equivalent)

  let startX = e.clientX, startY = e.clientY;
  let startBx = block.x, startBy = block.y;
  let startBw = block.w, startBh = block.h;

  document.body.style.cursor = mode==='resize' ? 'nwse-resize' : 'move';

  function onMove(ev){
    let dx = (ev.clientX - startX) * ratio;
    let dy = (ev.clientY - startY) * ratio;

    if(mode === 'resize'){
      block.w = Math.max(20, startBw + dx);
      block.h = Math.max(10, startBh + dy);
    } else {
      block.x = clamp(startBx + dx, 0, 128);
      block.y = clamp(startBy + dy, 0, 160);
    }
    // Update DOM directly for performance
    let el = document.querySelector(`[data-id="${block.id}"]`);
    if(el){
      el.style.left  = block.x + 'mm';
      el.style.top   = block.y + 'mm';
      el.style.width = block.w + 'mm';
      el.style.height= block.h + 'mm';
    }
    updateBlockEditor();
  }

  function onUp(){
    document.body.style.cursor = '';
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }

  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup',   onUp);
}

/* ════════════════════════════════════════════
   ACTIONS
════════════════════════════════════════════ */
function selectBlock(id){
  selectedBlockId = id;
  document.querySelectorAll('.block-wrap').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === id);
  });
  switchTab('block');
  updateBlockEditor();
}

function updateBlockEditor(){
  let block = curPage().blocks.find(b=>b.id===selectedBlockId);
  document.getElementById('noSel').style.display    = block ? 'none' : '';
  document.getElementById('blockEditor').style.display = block ? '' : 'none';
  if(!block) return;
  document.getElementById('bTitle').value = block.title;
  document.getElementById('bText').value  = block.text || '';
  document.getElementById('bX').value = Math.round(block.x);
  document.getElementById('bY').value = Math.round(block.y);
  document.getElementById('bW').value = Math.round(block.w);
  document.getElementById('bH').value = Math.round(block.h);
}

function updateBlockProp(key, val){
  let block = curPage().blocks.find(b=>b.id===selectedBlockId);
  if(!block) return;
  block[key] = val;
  if(key==='title'||key==='text'){
    // Re-render block content
    let el = document.querySelector(`[data-id="${block.id}"] .block-inner`);
    if(el) el.innerHTML = blockHTML(block);
  } else {
    let el = document.querySelector(`[data-id="${block.id}"]`);
    if(el){
      el.style.left   = block.x+'mm';
      el.style.top    = block.y+'mm';
      el.style.width  = block.w+'mm';
      el.style.height = block.h+'mm';
    }
  }
}

function updatePageProp(key, val){
  curPage()[key] = val;
  if(key==='lesson') document.getElementById('lessonLabel').textContent = val;
  if(key==='footer') document.getElementById('footerLabel').textContent = val;
  if(key==='title')  { document.getElementById('pgLabel').textContent = `${val} · ${currentPageIdx+1}/${pages.length}`; renderPageList(); }
}

function setTheme(t){
  curPage().theme = t;
  document.getElementById('pageEl').className = `page theme-${t}`;
  document.querySelectorAll('.theme-dot').forEach(d=>{
    const map={blue:'Arabe',green:'Islamique',purple:'Moderne',orange:'Maths'};
    d.classList.toggle('active', d.title.includes(map[t]||t));
  });
}

function addBlock(key){
  let block = mkBlock(key);
  curPage().blocks.push(block);
  let area = document.getElementById('editArea');
  area.appendChild(renderBlock(block));
  selectBlock(block.id);
}

function duplicateBlock(){
  let block = curPage().blocks.find(b=>b.id===selectedBlockId);
  if(!block) return;
  let copy = {...block, id:uid(), x:block.x+4, y:block.y+4};
  curPage().blocks.push(copy);
  document.getElementById('editArea').appendChild(renderBlock(copy));
  selectBlock(copy.id);
}

function deleteBlock(){
  if(!selectedBlockId) return;
  curPage().blocks = curPage().blocks.filter(b=>b.id!==selectedBlockId);
  let el = document.querySelector(`[data-id="${selectedBlockId}"]`);
  if(el) el.remove();
  selectedBlockId = null;
  updateBlockEditor();
}

function addPage(){
  pages.push(mkPage(pages.length));
  currentPageIdx = pages.length-1;
  selectedBlockId = null;
  renderPage();
}

function goPage(delta){
  let next = clamp(currentPageIdx+delta, 0, pages.length-1);
  if(next===currentPageIdx) return;
  currentPageIdx = next;
  selectedBlockId = null;
  renderPage();
}

function setZoom(z){
  zoom = clamp(z, 0.35, 1.5);
  document.getElementById('pageEl').style.transform = `scale(${zoom})`;
  document.getElementById('zoomLabel').textContent = Math.round(zoom*100)+'%';
}

function switchTab(tab){
  activeTab = tab;
  document.getElementById('pageTab').style.display  = tab==='page'  ? '' : 'none';
  document.getElementById('blockTab').style.display = tab==='block' ? '' : 'none';
  document.getElementById('tabPage').classList.toggle('active',  tab==='page');
  document.getElementById('tabBlock').classList.toggle('active', tab==='block');
}

// Deselect when clicking canvas background
document.getElementById('editArea').addEventListener('pointerdown', e=>{
  if(e.target === e.currentTarget){ selectedBlockId=null; document.querySelectorAll('.block-wrap').forEach(el=>el.classList.remove('selected')); updateBlockEditor(); }
});

/* ════════════════════════════════════════════
   AUTO-ZOOM
════════════════════════════════════════════ */
function autoZoom(){
  let area = document.getElementById('canvasArea');
  let W = area.clientWidth  - 56;
  let H = area.clientHeight - 56;
  let pageW = 148/25.4*96;
  let pageH = 210/25.4*96;
  zoom = Math.max(0.35, Math.min(1.3, W/pageW, H/pageH) * 0.96);
  document.getElementById('pageEl').style.transform = `scale(${zoom})`;
  document.getElementById('zoomLabel').textContent = Math.round(zoom*100)+'%';

  // Adjust wrapper height so scroll works
  let wrapper = document.getElementById('pageEl').parentElement||document.getElementById('pageEl');
}
window.addEventListener('resize', autoZoom);

/* ════════════════════════════════════════════
   INIT
════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', ()=>{
  renderLibrary();
  renderPage();
  setTimeout(autoZoom, 100);
});
</script>

</body>
</html>
