<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دفتر ماجور — اللغة العربية &middot; التربية الإسلامية — 6AF V2</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:#E8EBF0;color:#0f172a;direction:rtl}
.page{width:210mm;min-height:297mm;margin:16px auto;background:#FAF6EE;padding:6mm 20mm 52mm 9mm;box-shadow:0 6px 36px rgba(0,0,0,.18);position:relative;overflow:hidden}
@media print{
  body{background:#fff}
  .page{margin:0;box-shadow:none;page-break-after:always;height:297mm;overflow:visible;padding:6mm 20mm 52mm 9mm;}
  .answer-line{height:30px!important;margin-bottom:3px!important}
  .labeled-lines .answer-line{height:22px!important;margin-bottom:1px!important}
  .writing-area .answer-line{height:24px!important;margin-bottom:2px!important}
  .writing-area{padding:3px 8px!important}
  .exo-card{padding:5px 9px 4px!important;margin-bottom:4px!important}
  .fill-item{min-height:52px!important}
  .answer-cell{height:32px!important}
  .fill-answer-line{height:42px!important}
  .exo-instr{font-size:11px!important}
  .fill-word{font-size:11px!important}
  .reading-box{font-size:10.5px!important;line-height:1.65!important;padding:7px 11px!important}
  .sec-pill-wrap{margin:6px 0 5px!important}
  .grid2{gap:6px!important}
  .hint-box{padding:3px 8px!important;margin-bottom:4px!important}
  .student-bar{margin-bottom:7px!important}
  .page-header{padding-bottom:6px!important;margin-bottom:7px!important}
  .qr-strip{position:absolute!important;bottom:20mm!important;left:9mm!important;right:9mm!important;margin:0!important;padding:6px 12px!important;display:flex!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .qr-img-wrap{display:block!important;flex-shrink:0!important}
  .qr-img-wrap img{display:block!important;width:60px!important;height:60px!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .word-bank{padding:4px 9px!important;margin-bottom:5px!important}
  .exo-head{margin-bottom:5px!important}
  .exo-example{padding:4px 9px!important;margin-bottom:5px!important}
  .wave-footer svg{height:14px!important}
  .blob-wrap{display:none}
  /* ── Circle grid print ── */
  .circle-grid{display:grid!important;grid-template-columns:1fr 1fr!important;gap:5px!important;margin-top:3px!important}
  .circle-item{padding:5px 8px!important;border:1.5px solid #93C5FD!important;border-radius:8px!important;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .circle-sentence{font-size:11px!important;font-weight:800!important}
  .circle-choices{gap:4px!important;margin-top:3px!important}
  .circle-choice{border:1.5px solid #2563eb!important;border-radius:999px!important;padding:1px 8px!important;font-size:10px!important;font-weight:700!important;color:#2563eb!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* ── Qaaida box print ── */
  .qaaida-box{padding:5px 10px!important;margin-bottom:6px!important;border:1.5px solid #93C5FD!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .qaaida-text{font-size:10px!important}
  .qaaida-text span.hl{background:#DBEAFE!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* ── two-lines print ── */
  .fill-item.two-lines{padding:4px 8px!important;gap:2px!important;background:#faf9ff!important;border-color:#93C5FD!important;border-right:4px solid #2563eb!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid}
  .fill-item.two-lines .fill-top{border-bottom:1px solid #DBEAFE!important;padding-bottom:3px!important;gap:5px!important}
  .fill-answer-2{gap:2px!important;margin-top:1px!important}
  .fill-answer-2 .ans-line{height:15px!important;border-bottom:1.5px solid #93C5FD!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .fill-answer-2 .ans-label{font-size:8px!important;min-width:auto!important}
  .fill-index{background:linear-gradient(135deg,#2563eb,#38bdf8)!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;width:19px!important;height:19px!important;font-size:9px!important}
  /* ── fill-choices print : inline, compact, clippé par overflow:hidden du parent ── */
  .fill-choices{font-size:8.5px!important;font-weight:900!important;color:#fff!important;white-space:nowrap!important;flex-shrink:0!important;background:linear-gradient(90deg,#2563eb,#38bdf8)!important;border-radius:999px!important;padding:1px 7px!important;order:0!important;flex-basis:auto!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .fill-item.two-lines .fill-top{flex-wrap:nowrap!important;gap:5px!important;overflow:hidden!important}
  .fill-item{border-right:4px solid #2563eb!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .fill-answer-2 .ans-label{background:#2563eb!important;color:#fff!important;border-radius:4px!important;padding:1px 5px!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .fill-item.two-lines .fill-word{font-size:11px!important}
  /* ── fill-grid print ── */
  .fill-grid{gap:4px!important;margin-top:3px!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .fill-item.two-lines{min-height:auto!important;break-inside:avoid}
  /* ── word-bank print ── */
  .bank-word{border:1.5px solid!important;padding:1px 7px!important;font-size:10.5px!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bank-label{font-size:9px!important}
  /* ── harf / damir grid print ── */
  .harf-grid,.damir-grid{gap:4px!important;margin-top:3px!important}
  .harf-item,.damir-item{padding:4px 8px!important;font-size:10.5px!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* ── table print ── */
  .ex-table{font-size:9.5px!important}
  .ex-table th{font-size:8.5px!important;padding:3px 6px!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ex-table td.word-cell{padding:3px 6px!important;background:#f8fafc!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ex-table td.answer-cell{height:28px!important}
}
/* ── Page header ── */
.page-header{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid;padding-bottom:7px;margin-bottom:8px;gap:8px}
.brand-wrap{display:flex;align-items:center;gap:8px}
.brand-svg{flex-shrink:0}
.brand-name{font-size:15px;font-weight:900;line-height:1.1}
.brand-sub{font-size:9px;color:#64748b;font-weight:600}
.student-bar{display:none}
.info-field{display:flex;align-items:center;gap:5px;border-bottom:1.5px solid #334155;padding:1px 4px}
.fl{font-size:9.5px;font-weight:900;color:#475569;white-space:nowrap;flex-shrink:0}
.fl-line{flex:1;min-height:15px}
/* ── Section pill (j'apprend style) ── */
.sec-pill-wrap{display:flex;align-items:center;gap:10px;margin:9px 0 7px}
.sec-pill{font-size:13px;font-weight:900;font-style:italic;color:#fff;padding:5px 20px;border-radius:999px;letter-spacing:.5px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
/* ── Exercise card ── */
.exo-card{background:#fff;border-radius:16px;padding:9px 12px 8px;margin-bottom:7px;break-inside:avoid;position:relative;border:2px solid #111;box-shadow:3px 3px 0 #111}
.major-corner{position:absolute;bottom:7px;left:8px;opacity:.28;pointer-events:none;user-select:none;line-height:0}
.exo-head{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;margin-bottom:6px}
.exo-num-wrap{display:flex;align-items:center;gap:6px}
/* circle + arrow badge like math.pdf */
.exo-circle{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;flex-shrink:0}
.exo-arrow{display:inline-block;font-size:14px;font-weight:900;margin-right:4px}
.exo-level{font-size:8.5px;font-weight:900;padding:2px 9px;border-radius:999px}
.level-easy{background:#f0fdf4;color:#15803d}
.level-medium{background:#fffbeb;color:#b45309}
.level-hard{background:#fef2f2;color:#b91c1c}
.exo-pts{font-size:9.5px;font-weight:900;color:#94a3b8}
.exo-instr{font-size:12px;font-weight:700;line-height:1.65;color:#0f172a;margin-bottom:7px}
.exo-verb{font-weight:900;text-decoration:underline;text-decoration-style:wavy;margin-left:3px}
.exo-tip{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;margin-bottom:5px;opacity:.85}
.exo-example{border:1.5px dashed;border-radius:9px;padding:5px 10px;margin-bottom:6px;font-size:10.5px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ex-label{font-size:9px;font-weight:900;color:#fff;border-radius:5px;padding:2px 7px;flex-shrink:0}
/* ── Hint box ── */
.hint-box{display:flex;align-items:center;gap:7px;border:1.5px solid;border-radius:10px;padding:5px 9px;margin-bottom:6px;font-size:9.5px;font-weight:700}
.hint-camel{flex-shrink:0}
.hint-text{line-height:1.5;opacity:.9}
/* ── Answer lines ── */
.answer-lines{margin-top:3px}
.labeled-lines{margin-top:3px}
.ll-label{font-size:9.5px;font-weight:900;margin:6px 0 1px}
.labeled-lines .answer-line{height:22px;margin-bottom:1px}
.answer-line{height:34px;border-bottom:1.8px dashed #cbd5e1;margin-bottom:5px}
.answer-line.solid{border-bottom-style:solid;border-bottom-color:#94a3b8}
/* ── Règle (القاعدة) box ── */
.qaaida-box{background:linear-gradient(135deg,#EEF2FF 0%,#DBEAFE 100%);border-right:4px solid #2563eb;border-top:1.5px solid #93C5FD;border-bottom:1.5px solid #93C5FD;border-left:1.5px solid #93C5FD;border-radius:12px;padding:8px 12px;margin-bottom:8px;direction:rtl}
.qaaida-title{font-size:14px;font-weight:900;color:#2563eb;letter-spacing:.5px;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.qaaida-title::before{content:"📌";font-size:16px}
.qaaida-text{font-size:11px;font-weight:700;color:#1e3a5f;line-height:1.7}
.qaaida-text span.hl{background:#DBEAFE;border-radius:4px;padding:0 4px;color:#1e40af}
@media print{.qaaida-box{background:#EEF2FF!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* ── Damir (pronoun) fill-in-blank ── */
.damir-grid{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.damir-item{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;flex-direction:row-reverse;gap:8px}
.damir-num{color:#2563eb;font-size:11px;font-weight:900;min-width:14px;flex-shrink:0}
.damir-sent{font-size:13px;font-weight:700;text-align:right;white-space:nowrap;flex:1}
.damir-hint{font-size:9.5px;font-weight:700;color:#2563eb;background:#EEF2FF;border:1px solid #93C5FD;border-radius:999px;padding:2px 8px;white-space:nowrap;flex-shrink:0}
@media print{.damir-item{-webkit-print-color-adjust:exact;print-color-adjust:exact}.damir-hint{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* ── Harf jar fill-in-blank ── */
.harf-grid{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.harf-item{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;flex-direction:row-reverse;white-space:nowrap}
.harf-num{color:#2563eb;font-size:11px;font-weight:900;min-width:16px;text-align:center;flex-shrink:0}
.harf-sent{font-size:13px;font-weight:700;text-align:right;white-space:nowrap}
.harf-blank{display:inline-block;min-width:60px;height:18px;vertical-align:bottom;box-shadow:0 2px 0 #2563eb;margin:0 4px}
@media print{.harf-item{-webkit-print-color-adjust:exact;print-color-adjust:exact}.harf-blank{box-shadow:0 2px 0 #2563eb!important}}
/* ── Circle choice grid ── */
.circle-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:4px}
.circle-item{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding:7px 9px;display:flex;flex-direction:column;gap:5px}
.circle-sentence{font-size:12px;font-weight:800;text-align:right;line-height:1.4}
.circle-choices{display:flex;flex-direction:row-reverse;gap:5px;flex-wrap:wrap;justify-content:flex-start}
.circle-choice{border:1.5px solid #2563eb;border-radius:999px;padding:2px 9px;font-size:10px;font-weight:700;color:#2563eb;white-space:nowrap}
@media print{
  .circle-choice{border-color:#2563eb!important;color:#2563eb!important}
}
/* ── Fill grid ── */
.fill-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:5px}
.fill-item{background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:7px 10px;display:flex;align-items:center;gap:6px;min-height:52px;transition:box-shadow .2s}
.fill-index{font-size:10px;font-weight:900;color:#2563eb;flex-shrink:0;min-width:14px;background:#EEF2FF;border-radius:999px;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.fill-word{font-size:12px;font-weight:800;flex-shrink:0;max-width:110px}
.fill-word strong,.exo-example strong{text-decoration:underline;text-underline-offset:3px;color:#1e3a5f}
.fill-arrow{font-size:10px;color:#94a3b8;flex-shrink:0}
.fill-answer-line{flex:1;height:36px;border-bottom:2px dashed #93C5FD}
/* ── Two-lines format ── */
.fill-item.two-lines{flex-direction:column;align-items:stretch;gap:5px;min-height:auto;padding:7px 10px;background:#fff;border-color:#93C5FD;overflow:hidden}
.fill-item.two-lines .fill-top{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;padding-bottom:5px;border-bottom:1.5px solid #DBEAFE;overflow:hidden}
/* fill-choices : pill inline — overflow clippé par l'item (overflow:hidden) */
.fill-choices{font-size:9px;font-weight:900;color:#fff;white-space:nowrap;flex-shrink:0;background:linear-gradient(90deg,#2563eb,#38bdf8);border-radius:999px;padding:2px 9px;box-shadow:0 1px 4px rgba(37,99,235,.3)}
.fill-item.two-lines .fill-top .fill-word{max-width:none;flex:1;font-size:11.5px;min-width:0;line-height:1.45}
.fill-answer-2{display:flex;flex-direction:column;width:100%;gap:4px;margin-top:2px}
.fill-answer-2 .ans-row{display:flex;align-items:center;gap:5px;width:100%}
.fill-answer-2 .ans-label{font-size:8.5px;font-weight:900;color:#fff;white-space:nowrap;flex-shrink:0;background:#2563eb;border-radius:5px;padding:1px 6px;min-width:auto}
.fill-answer-2 .ans-line{flex:1;height:20px;border-bottom:2px dashed #93C5FD}
/* ── Word bank ── */
.word-bank{border:1.5px dashed;border-radius:9px;padding:5px 11px;margin-bottom:7px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:#fff}
.bank-label{font-size:9.5px;font-weight:900;white-space:nowrap}
.bank-words{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.bank-word{background:#fff;border:1.5px solid;border-radius:7px;padding:2px 9px;font-size:11.5px;font-weight:700;color:#1e293b}
/* ── Table ── */
.ex-table{width:100%;border-collapse:collapse;margin-top:5px;font-size:10.5px}
.ex-table th{color:#fff;padding:5px 8px;font-weight:900;font-size:9.5px;border:1px solid rgba(0,0,0,.15)}
.ex-table td{padding:0;border:1px solid #e2e8f0;vertical-align:middle}
.ex-table td.word-cell{padding:5px 8px;font-weight:700;background:#f8fafc}
.ex-table td.answer-cell{height:38px;background:#fdfbff;position:relative}.ex-table td.answer-cell::after{content:'';position:absolute;bottom:7px;right:10%;left:10%;height:0;border-bottom:1.5px solid #93C5FD}
.ex-table tr:nth-child(even) td.word-cell{background:#f1f5f9}
/* ── QCM / TF ── */
.qcm-item{margin-bottom:8px}
.qcm-q{font-size:11px;font-weight:700;margin-bottom:4px;line-height:1.55}
.qcm-num{font-weight:900;margin-left:3px}
.qcm-choices{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding-right:10px}
.choice-btn{border:1.5px solid;border-radius:9px;padding:4px 10px;font-size:10.5px;font-weight:700;background:#fff}
.tf-item{display:flex;align-items:center;justify-content:space-between;border:1.5px solid;border-radius:9px;padding:6px 10px;margin-bottom:5px;font-size:11px;font-weight:700;background:#fff}
.tf-box{border:2px solid;width:22px;height:22px;border-radius:6px;flex-shrink:0;background:#fff}
/* ── QR strip (dashed like math.pdf) ── */
.qr-strip{display:flex;align-items:center;gap:10px;border:2.5px dashed;border-radius:16px;padding:7px 14px;background:#fff;position:absolute;bottom:20mm;left:9mm;right:9mm;margin:0}
.qr-img-wrap{flex-shrink:0;background:#fff;border-radius:6px;padding:2px}
.qr-text{font-size:10px;font-weight:700;line-height:1.6}
.qr-text strong{font-size:11px;font-weight:900;display:block}
/* ── Reading ── */
.reading-box{background:#fff;border:1.5px solid;border-radius:14px;padding:10px 14px;margin-bottom:8px;font-size:11.5px;font-weight:600;line-height:1.85;direction:rtl;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.reading-title{font-size:13px;font-weight:900;margin-bottom:5px}
.reading-box p{margin-bottom:3px}
.writing-area{border:1.5px solid #e2e8f0;border-radius:9px;background:#fff;padding:4px 10px}
.writing-area .answer-line{border-bottom-color:#e2e8f0;height:26px;margin-bottom:2px}
/* ── Grid ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
/* ── Wave footer ── */
.wave-footer{position:absolute;bottom:0;left:0;right:0;line-height:0}
.wave-footer svg{width:100%;height:18px;display:block}
/* ── Blobs ── */
.blob-wrap{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden}
.blob-tl{position:absolute;top:-15px;right:-15px}
.blob-br{position:absolute;bottom:18px;left:-10px}
/* ── Page num ── */
.page-num{position:absolute;bottom:6mm;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:rgba(0,0,0,0.45);direction:ltr;letter-spacing:1px}
/* ── Print button ── */
.print-btn{position:fixed;bottom:24px;left:24px;background:linear-gradient(135deg,#2563eb,#6d28d9);color:#fff;border:none;border-radius:50px;padding:12px 24px;font-family:'Cairo',serif;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(124,58,237,.4);z-index:99}

/* ======== CARTOON STYLE V3 — A4 layout, print B5 ======== */
body { font-family: 'Cairo', sans-serif !important; }
.page { background: #FAF6EE !important; }

/* Header dégradé bleu */
.page-header {
  background: linear-gradient(135deg,#1e3a5f 0%,#2563eb 60%,#38bdf8 100%) !important;
  border-radius: 14px 14px 0 0 !important;
  border-bottom: 3px solid #111 !important;
  padding: 9px 14px 8px !important;
  margin: -2px -2px 8px -2px !important;
  box-shadow: 0 4px 0 rgba(0,0,0,.25) !important;
}
/* Header dégradé vert — pages islamiques */
.page-header.islamic {
  background: linear-gradient(135deg,#064e3b 0%,#059669 60%,#34d399 100%) !important;
}
.brand-name { color:#fff !important; font-weight:900 !important; }
.brand-sub  { color:#BFDBFE !important; }
.info-field { border-bottom:2px solid #2563eb !important; }
.fl { color:#1e3a5f !important; font-weight:900 !important; }
.sec-pill { border:2.5px solid #111 !important; box-shadow:3px 3px 0 #111 !important; font-weight:900 !important; }
.qaaida-box { background:linear-gradient(135deg,#EEF2FF 0%,#DBEAFE 80%) !important; border-right:5px solid #2563eb !important; border-top:2px solid #93C5FD !important; border-bottom:2px solid #93C5FD !important; border-left:2px solid #93C5FD !important; border-radius:14px !important; box-shadow:3px 3px 0 rgba(37,99,235,.2) !important; }
.qaaida-title { color:#2563eb !important; font-weight:900 !important; font-size:14px !important; }
.qaaida-text { font-size:11px !important; line-height:1.7 !important; }
.qaaida-text .hl { background:#DBEAFE !important; color:#1e40af !important; border-radius:4px !important; padding:0 3px !important; }
.exo-card { border:2.5px solid #111 !important; border-radius:14px !important; box-shadow:3px 3px 0 #111 !important; }
.exo-circle { border:2px solid #111 !important; box-shadow:2px 2px 0 #111 !important; font-weight:900 !important; }

        <div style="font-size:10px;font-weight:700;color:#BFDBFE;margin-top:2px">15 صفحة · 90+ تمريناً</div>
      </div>
      <div style="background:linear-gradient(135deg,#064e3b,#059669);border:2.5px solid rgba(255,255,255,.4);border-radius:14px;padding:8px 16px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.3);min-width:130px">
        <div style="font-size:18px;margin-bottom:2px">&#9770;</div>
        <div style="font-size:13px;font-weight:900;color:#fff">التربية الإسلامية</div>
        <div style="font-size:10px;font-weight:700;color:#A7F3D0;margin-top:2px">7 صفحات · 45+ تمريناً</div>
      </div>
    </div>
    <!-- Bandeau info -->
    <div style="background:rgba(253,230,138,.15);border:1.5px solid rgba(253,230,138,.5);border-radius:14px;padding:9px 16px;font-size:11px;font-weight:700;color:#fde68a;max-width:340px;margin:0 auto">
      &#128241; كل تمرين مرتبط بـQR Code للتصحيح الفوري بالذكاء الاصطناعي
    </div>
  </div>

</div></div>
<script>
(() => {
  const BASE_SCALE = 148 / 210;
  const FOOTER_GAP_MM = 6;
  const HORIZONTAL_GAP_MM = 5;
  const SAFETY = 0.992;
  const DECO = ['wave-footer', 'page-num', 'qr-strip', 'blob-wrap', 'spiral-strip'];

  const important = (el, prop, value) => el.style.setProperty(prop, value, 'important');
  const clear = (el, ...props) => props.forEach((prop) => el.style.removeProperty(prop));
  const px = (value) => Number.parseFloat(value) || 0;

  const page = () => document.querySelector('.page');
  const inner = () => document.querySelector('.page > .print-scale-inner');
  const footer = () => document.querySelector('.page > .qr-footer');

  const resetViewport = () => {
    const p = page();
    if (!p) return;
    clear(p, 'position', 'inset', 'top', 'left', 'right', 'bottom', 'transform',
      'transform-origin', 'margin', 'margin-top', 'margin-bottom');
    clear(document.documentElement, 'width', 'height', 'overflow', 'background');
    clear(document.body, 'width', 'height', 'overflow', 'padding', 'margin', 'background');
  };

  const measurableElements = (root) => Array.from(root.querySelectorAll('*')).filter((el) => {
    const st = getComputedStyle(el);
    if (st.display === 'none' || st.visibility === 'hidden') return false;
    if (DECO.some((cls) => el.closest('.' + cls))) return false;
    return true;
  });

  const measureContent = (root) => {
    const rootBox = root.getBoundingClientRect();
    let bottom = root.scrollHeight || 0;
    let left = 0;
    let right = Math.max(rootBox.width, root.scrollWidth || 0);

    measurableElements(root).forEach((el) => {
      const st = getComputedStyle(el);
      const box = el.getBoundingClientRect();
      if (!box.width && !box.height) return;

      const relTop = box.top - rootBox.top;
      const relBottom = box.bottom - rootBox.top;
      const relLeft = box.left - rootBox.left;
      const relRight = box.right - rootBox.left;

      bottom = Math.max(
        bottom,
        relBottom + px(st.marginBottom),
        relTop + el.offsetHeight + px(st.marginTop) + px(st.marginBottom)
      );
      left = Math.min(left, relLeft - px(st.marginLeft));
      right = Math.max(right, relRight + px(st.marginRight));
    });

    bottom = Math.max(bottom, root.scrollHeight || 0, rootBox.height);
    if (bottom < 10) bottom = rootBox.height;
    return { bottom, width: right - left };
  };

  const fitPage = () => {
    const p = page();
    const root = inner();
    if (!p || !root) return;

    resetViewport();
    important(root, 'transform', 'none');

    const pageBox = p.getBoundingClientRect();
    const rootBox = root.getBoundingClientRect();
    const footerBox = footer()?.getBoundingClientRect();
    const mmPx = pageBox.height / 210;
    const mmPxW = pageBox.width / 148;
    const reservedFooter = (footerBox?.height || 0) + FOOTER_GAP_MM * mmPx;
    const availableHeight = Math.max(1, pageBox.height - reservedFooter);
    const availableWidth = Math.max(1, pageBox.width - HORIZONTAL_GAP_MM * mmPxW);
    const content = measureContent(root);

    const scaleByFooter = availableHeight / content.bottom;
    const scaleByPageHeight = pageBox.height / content.bottom;
    const scaleByWidth = availableWidth / Math.max(rootBox.width, root.scrollWidth || 0, content.width);
    const scale = Math.min(BASE_SCALE, scaleByFooter, scaleByPageHeight, scaleByWidth) * SAFETY;

    root.style.setProperty('--page-scale', String(Math.max(0.1, scale)));
    root.style.removeProperty('transform');
  };

  const fitViewport = () => {
    if (window.matchMedia && window.matchMedia('print').matches) return;

    const p = page();
    if (!p) return;

    const pageW = p.offsetWidth;
    const pageH = p.offsetHeight;
    const scale = Math.min(1, (window.innerWidth - 8) / pageW, (window.innerHeight - 8) / pageH);
    const visualW = Math.ceil(pageW * scale);
    const visualH = Math.ceil(pageH * scale);

    important(document.documentElement, 'width', '100vw');
    important(document.documentElement, 'height', '100vh');
    important(document.documentElement, 'overflow', 'hidden');
    important(document.body, 'width', '100vw');
    important(document.body, 'height', '100vh');
    important(document.body, 'margin', '0');
    important(document.body, 'padding', '0');
    important(document.body, 'overflow', 'hidden');
    important(document.body, 'background', '#e5e7eb');

    important(p, 'position', 'fixed');
    important(p, 'top', '50%');
    important(p, 'left', '50%');
    important(p, 'margin', '0');
    important(p, 'transform-origin', 'center center');
    important(p, 'transform', 'translate(-50%, -50%) scale(' + scale.toFixed(4) + ')');

    document.documentElement.dataset.a5Fit = '1';
    window.__a5Fit = { scale, visualW, visualH, pageW, pageH };
  };

  const run = () => {
    fitPage();
    fitViewport();
  };

  const runPrint = () => {
    resetViewport();
    fitPage();
  };

  window.addEventListener('load', run);
  window.addEventListener('resize', run);
  window.addEventListener('beforeprint', runPrint);
  window.addEventListener('afterprint', run);

  if (document.fonts?.ready) {
    document.fonts.ready.then(run);
  }
  requestAnimationFrame(run);
})();
</script>
