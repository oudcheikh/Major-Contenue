<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cahier Major Studio</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
:root{--ink:#101828;--muted:#667085;--line:#d0d5dd;--paper:#fffaf0;--blue:#2563eb;--cyan:#38bdf8;--green:#059669;--amber:#f59e0b;--panel:#f8fafc}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0;overflow:hidden}
body{font-family:Inter,Segoe UI,Arial,sans-serif;background:#dce3ee;color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.studio{height:100%;display:grid;grid-template-columns:282px 1fr 328px;background:radial-gradient(circle at 30% 20%,#f8fbff 0,#dce3ee 42%,#ccd6e4 100%)}
.rail{background:rgba(248,250,252,.94);border-right:1px solid #cbd5e1;overflow:auto;padding:14px;backdrop-filter:blur(18px)}
.rail.right{border-right:0;border-left:1px solid #cbd5e1}
.brandbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1e3a8a,#2563eb 55%,#38bdf8);display:grid;place-items:center;color:white;font-weight:900;box-shadow:0 8px 20px rgba(37,99,235,.26)}
h1{font-size:17px;margin:0;line-height:1.1}.small{font-size:11px;color:var(--muted)}
h2{font-size:12px;margin:18px 0 8px;color:#475467;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.row.between{justify-content:space-between}
.btn{border:1px solid #cbd5e1;background:white;border-radius:8px;padding:8px 10px;color:#172033;box-shadow:0 1px 0 rgba(16,24,40,.04)}
.btn.icon{width:36px;height:36px;padding:0;display:grid;place-items:center}
.btn.primary{border-color:#1d4ed8;background:#2563eb;color:white}
.btn.dark{border-color:#111827;background:#111827;color:white}
.btn.danger{background:#fff1f2;border-color:#fecdd3;color:#be123c}
.btn:active{transform:translateY(1px)}
.page-card{display:flex;align-items:center;justify-content:space-between;border:1px solid #d0d5dd;border-radius:10px;background:white;padding:9px;margin-bottom:8px}
.page-card.active{border-color:#2563eb;box-shadow:0 0 0 3px #dbeafe}
.page-card button{border:0;background:transparent;text-align:left;padding:0;flex:1}
.page-card strong{display:block;font-size:12px}.page-card span{font-size:10px;color:#667085}
.template{width:100%;border:1px solid #d0d5dd;background:white;border-radius:10px;margin-bottom:8px;padding:10px;text-align:left}
.template:hover{border-color:#2563eb;box-shadow:0 6px 18px rgba(37,99,235,.12)}
.template strong{display:block;font-size:13px}.template span{font-size:11px;color:#667085}
.canvas-wrap{position:relative;display:grid;place-items:center;overflow:hidden;padding:20px}
.topbar{position:absolute;top:14px;left:20px;right:20px;height:44px;display:flex;align-items:center;justify-content:space-between;z-index:5;pointer-events:none}
.topbar>*{pointer-events:auto}
.zoom{background:rgba(255,255,255,.88);border:1px solid #d0d5dd;border-radius:999px;padding:6px 10px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(16,24,40,.12);backdrop-filter:blur(16px)}
.page{width:148mm;height:210mm;position:relative;background:var(--paper);box-shadow:0 18px 70px rgba(15,23,42,.32);overflow:hidden;transform-origin:center;border-radius:2px}
.page::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 36%),radial-gradient(circle at 10% 8%,rgba(37,99,235,.08),transparent 22%);pointer-events:none}
.theme-blue{--accent:#2563eb;--accent2:#38bdf8;--deep:#1e3a5f}
.theme-green{--accent:#059669;--accent2:#34d399;--deep:#064e3b}
.theme-purple{--accent:#7c3aed;--accent2:#22d3ee;--deep:#312e81}
.page-header{position:absolute;top:0;left:0;right:0;height:22mm;background:linear-gradient(135deg,var(--deep),var(--accent) 62%,var(--accent2));border-bottom:2px solid #111;display:flex;align-items:center;justify-content:space-between;color:#fff;padding:0 8mm;direction:rtl;z-index:2}
.brand-title{font-size:15px;font-weight:900}.lesson{font-size:8.2px;opacity:.9;margin-top:2px}
.mascot{width:15mm;height:15mm;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);font-size:20px}
.spiral{position:absolute;right:0;top:0;bottom:0;width:8mm;background:repeating-linear-gradient(to bottom,transparent 0 8mm,rgba(17,24,39,.8) 8mm 8.7mm,transparent 8.7mm 16mm);opacity:.35;z-index:3;pointer-events:none}
.safe{position:absolute;left:7mm;right:12mm;top:27mm;bottom:23mm;border:1px dashed rgba(37,99,235,.22);border-radius:8px;pointer-events:none}
.footer{position:absolute;left:0;right:0;bottom:0;height:18mm;background:linear-gradient(135deg,var(--deep),var(--accent) 62%,var(--accent2));display:flex;align-items:center;gap:7px;padding:0 7mm;color:#fff;direction:rtl;z-index:4}
.qr{width:13mm;height:13mm;background:#fff;border-radius:4px;color:var(--accent);display:grid;place-items:center;font-size:8px;font-weight:900}.foottext{flex:1;text-align:right;font-size:8px;line-height:1.35}.pnum{font-size:8px;border:1px solid rgba(255,255,255,.42);border-radius:6px;padding:2px 7px}
.block{position:absolute;direction:rtl;background:white;border:2px solid #111;border-radius:8px;box-shadow:2px 2px 0 #111;padding:4px 6px;overflow:hidden;touch-action:none;z-index:10}
.block.selected{outline:3px solid #f59e0b;outline-offset:2px}
.block.rule{background:#eaf2ff;border-color:#93c5fd;border-right:5px solid var(--accent);box-shadow:2px 2px 0 rgba(37,99,235,.2)}
.block.soft{border-color:#93c5fd;box-shadow:2px 2px 0 rgba(37,99,235,.15)}
.block.glass{background:rgba(255,255,255,.82);border-color:rgba(147,197,253,.9);box-shadow:0 10px 25px rgba(37,99,235,.12);backdrop-filter:blur(8px)}
.block.minimal{border-color:#dbeafe;box-shadow:none;border-radius:6px}
.b-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}.pill{background:var(--accent);color:#fff;border-radius:999px;padding:2px 7px;font-size:7.4px;font-weight:900}.pts{font-size:7px;color:#98a2b3;font-weight:900}
.b-title{font-size:9px;font-weight:900;line-height:1.25;margin-bottom:3px}.b-text{font-size:8px;line-height:1.45;color:#1e3a5f;font-weight:800}.example{background:#eef5ff;border:1px solid #93c5fd;border-radius:6px;padding:3px 5px;margin-bottom:3px}
.items{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px}.item{border:1px solid #93c5fd;border-right:3px solid var(--accent);border-radius:6px;padding:3px 4px;min-width:0}.itop{display:flex;gap:3px;align-items:center;border-bottom:1px solid #dbeafe;padding-bottom:2px;margin-bottom:2px}.num{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:7px;font-weight:900;flex:none}.word{font-size:7.8px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.line{height:9px;border-bottom:1.4px dashed #93c5fd}
.table-mini{width:100%;border-collapse:collapse;font-size:7.6px}.table-mini th{background:var(--accent);color:#fff;padding:3px}.table-mini td{border:1px solid #93c5fd;padding:3px;height:9mm}
.writing-lines .line{height:7mm}.resize{position:absolute;width:13px;height:13px;right:2px;bottom:2px;border-radius:4px;background:#f59e0b;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.28);cursor:nwse-resize}
.props label{display:block;font-size:11px;color:#475467;margin:9px 0 4px}.props input,.props textarea,.props select{width:100%;border:1px solid #d0d5dd;border-radius:8px;background:white;padding:8px}.props textarea{min-height:72px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.swatch{width:30px;height:30px;border-radius:8px;border:2px solid white;box-shadow:0 0 0 1px #cbd5e1}.json{height:170px;font-family:Consolas,monospace;font-size:11px;direction:ltr}
@media print{html,body,#root{height:auto;overflow:visible}.studio{display:block;background:white}.rail,.topbar{display:none}.canvas-wrap{display:block;padding:0}.page{box-shadow:none;transform:none!important;border-radius:0;page-break-after:always}@page{size:A5 portrait;margin:0}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useMemo,useState,useRef,useEffect}=React;
const h=React.createElement;
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const mmToCss=v=>`${v}mm`;

const templates={
  rule:{type:"rule",title:"القاعدة",text:"اكتب هنا قاعدة الدرس بشكل مختصر وواضح.",x:7,y:28,w:126,h:18,variant:"rule"},
  exercise:{type:"exercise",title:"أعرب الكلمات التي تحتها خط :",text:"مثال: الجهل ظلام — الجهل: مبتدأ مرفوع.",x:49,y:52,w:87,h:51,variant:"card"},
  wide:{type:"exercise",title:"أكمل الجدول بما يناسب :",text:"استعمل الكلمات المناسبة في الفراغات.",x:7,y:52,w:126,h:43,variant:"card"},
  table:{type:"table",title:"أكمل الجدول :",text:"",x:7,y:102,w:70,h:56,variant:"soft"},
  writing:{type:"writing",title:"ركب جملة مفيدة :",text:"",x:7,y:148,w:126,h:32,variant:"soft"}
};
const freshPage=n=>({id:uid(),title:`Page ${n}`,theme:"theme-blue",lesson:"اللغة العربية — نموذج الدرس",footer:"نموذج مستقل لصناعة الكراسات",blocks:[
  {...templates.rule,id:uid()},
  {...templates.exercise,id:uid(),x:49,y:52}
]});

function App(){
  const [pages,setPages]=useState(()=>JSON.parse(localStorage.getItem("majorStudio")||"null")||[freshPage(1)]);
  const [pageId,setPageId]=useState(pages[0].id);
  const [selected,setSelected]=useState(pages[0].blocks[0]?.id||null);
  const [zoom,setZoom]=useState(.86);
  const page=pages.find(p=>p.id===pageId)||pages[0];
  const block=page?.blocks.find(b=>b.id===selected);
  useEffect(()=>localStorage.setItem("majorStudio",JSON.stringify(pages)),[pages]);

  const updatePage=(patch)=>setPages(ps=>ps.map(p=>p.id===page.id?{...p,...patch}:p));
  const updateBlock=(id,patch)=>setPages(ps=>ps.map(p=>p.id===page.id?{...p,blocks:p.blocks.map(b=>b.id===id?{...b,...patch}:b)}:p));
  const addBlock=(kind)=>{const b={...templates[kind],id:uid(),x:templates[kind].x+page.blocks.length*2,y:templates[kind].y+page.blocks.length*2};setPages(ps=>ps.map(p=>p.id===page.id?{...p,blocks:[...p.blocks,b]}:p));setSelected(b.id)};
  const addPage=()=>{const p=freshPage(pages.length+1);setPages([...pages,p]);setPageId(p.id);setSelected(p.blocks[0].id)};
  const duplicate=()=>{if(!block)return;const b={...block,id:uid(),x:block.x+5,y:block.y+5};setPages(ps=>ps.map(p=>p.id===page.id?{...p,blocks:[...p.blocks,b]}:p));setSelected(b.id)};
  const removeBlock=()=>{if(!block)return;setPages(ps=>ps.map(p=>p.id===page.id?{...p,blocks:p.blocks.filter(b=>b.id!==block.id)}:p));setSelected(null)};
  const exportData=()=>JSON.stringify({version:1,pages},null,2);
  const importData=txt=>{const data=JSON.parse(txt);if(data.pages?.length){setPages(data.pages);setPageId(data.pages[0].id);setSelected(data.pages[0].blocks[0]?.id||null)}};

  return h("div",{className:"studio"},[
    h(LeftPanel,{key:"l",pages,pageId,setPageId,addPage,addBlock,setSelected}),
    h("main",{key:"c",className:"canvas-wrap"},[
      h("div",{className:"topbar"},[
        h("div",{className:"zoom"},[
          h("button",{className:"btn icon",onClick:()=>setZoom(z=>clamp(z-.08,.45,1.25))},"−"),
          h("span",{className:"small"},`${Math.round(zoom*100)}%`),
          h("button",{className:"btn icon",onClick:()=>setZoom(z=>clamp(z+.08,.45,1.25))},"+")
        ]),
        h("div",{className:"row"},[
          h("button",{className:"btn",onClick:()=>window.print()},"Imprimer"),
          h("button",{className:"btn dark",onClick:()=>navigator.clipboard?.writeText(exportData())},"Copier JSON")
        ])
      ]),
      h(PageCanvas,{page,zoom,selected,setSelected,updateBlock})
    ]),
    h(RightPanel,{key:"r",page,block,updatePage,updateBlock,duplicate,removeBlock,exportData,importData})
  ]);
}

function LeftPanel({pages,pageId,setPageId,addPage,addBlock,setSelected}){
  return h("aside",{className:"rail"},[
    h("div",{className:"brandbar"},[h("div",{className:"logo"},"M"),h("div",null,[h("h1",null,"Cahier Studio"),h("div",{className:"small"},"éditeur A5 moderne")])]),
    h("div",{className:"row"},[h("button",{className:"btn primary",onClick:addPage},"Ajouter page"),h("button",{className:"btn",onClick:()=>localStorage.removeItem("majorStudio")},"Reset save")]),
    h("h2",null,"Pages"),
    pages.map((p,i)=>h("div",{className:"page-card "+(p.id===pageId?"active":""),key:p.id},[
      h("button",{onClick:()=>{setPageId(p.id);setSelected(p.blocks[0]?.id||null)}},[h("strong",null,p.title),h("span",null,`${p.blocks.length} blocs`) ]),
      h("span",null,String(i+1).padStart(2,"0"))
    ])),
    h("h2",null,"Blocs"),
    [["rule","Règle / leçon","Encadré pédagogique"],["exercise","Exercice 2 colonnes","Carte compacte"],["wide","Exercice large","Pleine largeur"],["table","Tableau","Colonnes réponses"],["writing","Rédaction","Lignes libres"]].map(t=>
      h("button",{className:"template",key:t[0],onClick:()=>addBlock(t[0])},[h("strong",null,t[1]),h("span",null,t[2])])
    )
  ]);
}

function PageCanvas({page,zoom,selected,setSelected,updateBlock}){
  const ref=useRef(null);
  const mmPerPx=()=>148/ref.current.getBoundingClientRect().width;
  const startDrag=(e,b,mode)=>{
    e.stopPropagation();setSelected(b.id);
    const box=ref.current.getBoundingClientRect();const mm=mmPerPx();
    const sx=e.clientX,sy=e.clientY,start={...b};
    const move=ev=>{
      const dx=(ev.clientX-sx)*mm,dy=(ev.clientY-sy)*mm;
      if(mode==="resize") updateBlock(b.id,{w:clamp(start.w+dx,28,136-start.x),h:clamp(start.h+dy,14,190-start.y)});
      else updateBlock(b.id,{x:clamp(start.x+dx,0,148-start.w),y:clamp(start.y+dy,22,210-start.h-18)});
    };
    const up=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up)};
    window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
  };
  return h("section",{ref,className:`page ${page.theme}`,style:{transform:`scale(${zoom})`},onPointerDown:()=>setSelected(null)},[
    h("div",{className:"page-header"},[h("div",null,[h("div",{className:"brand-title"},"Major 6AF"),h("div",{className:"lesson"},page.lesson)]),h("div",{className:"mascot"},"📘")]),
    h("div",{className:"spiral"}),h("div",{className:"safe"}),
    page.blocks.map(b=>h(Block,{key:b.id,b,active:b.id===selected,startDrag})),
    h("div",{className:"footer"},[h("div",{className:"qr"},"QR"),h("div",{className:"foottext"},[h("strong",null,"امسح الرمز بهاتفك"),h("br"),page.footer]),h("div",{className:"pnum"},page.title)])
  ]);
}

function Block({b,active,startDrag}){
  const cls=["block",["rule","soft","glass","minimal"].includes(b.variant)?b.variant:"",active?"selected":""].join(" ");
  const style={left:mmToCss(b.x),top:mmToCss(b.y),width:mmToCss(b.w),height:mmToCss(b.h)};
  return h("article",{className:cls,style,onPointerDown:e=>startDrag(e,b,"move")},[
    b.type==="rule"&&[h("div",{className:"b-title",key:"t"},b.title),h("div",{className:"b-text",key:"x"},b.text)],
    b.type==="exercise"&&[h("div",{className:"b-head",key:"h"},[h("span",{className:"pill"},"تمرين"),h("span",{className:"pts"},"4 نقاط")]),h("div",{className:"b-title",key:"t"},b.title),h("div",{className:"example",key:"e"},b.text),h("div",{className:"items",key:"i"},[1,2,3,4].map(n=>h("div",{className:"item",key:n},[h("div",{className:"itop"},[h("span",{className:"num"},n),h("span",{className:"word"},`عنصر ${n}`)]),h("div",{className:"line"}),h("div",{className:"line"})])))],
    b.type==="table"&&[
      h("div",{className:"b-title",key:"t"},b.title),
      h("table",{className:"table-mini",key:"tb"},[
        h("thead",{key:"head"},h("tr",null,[h("th",null,"المفرد"),h("th",null,"الجمع")])),
        h("tbody",{key:"body"},[1,2,3].map(n=>h("tr",{key:n},[h("td",null,"كلمة"),h("td",null,"")])))
      ])
    ],
    b.type==="writing"&&[h("div",{className:"b-title",key:"t"},b.title),h("div",{className:"writing-lines",key:"w"},[1,2,3,4].map(n=>h("div",{className:"line",key:n})))],
    h("span",{className:"resize",onPointerDown:e=>startDrag(e,b,"resize")})
  ]);
}

function RightPanel({page,block,updatePage,updateBlock,duplicate,removeBlock,exportData,importData}){
  const [json,setJson]=useState("");
  useEffect(()=>setJson(exportData()),[page,block]);
  return h("aside",{className:"rail right"},[
    h("div",{className:"brandbar"},[h("div",{className:"logo"},"✦"),h("div",null,[h("h1",null,"Inspecteur"),h("div",{className:"small"},"style, contenu, export")])]),
    h("h2",null,"Page"),
    h("div",{className:"props"},[
      h("label",null,"Nom page"),h("input",{value:page.title,onChange:e=>updatePage({title:e.target.value})}),
      h("label",null,"Leçon"),h("input",{value:page.lesson,onChange:e=>updatePage({lesson:e.target.value})}),
      h("label",null,"Footer"),h("input",{value:page.footer,onChange:e=>updatePage({footer:e.target.value})}),
      h("label",null,"Theme"),h("select",{value:page.theme,onChange:e=>updatePage({theme:e.target.value})},[
        h("option",{value:"theme-blue"},"Bleu Major"),h("option",{value:"theme-green"},"Vert islamique"),h("option",{value:"theme-purple"},"Violet moderne")
      ])
    ]),
    h("h2",null,"Bloc sélectionné"),
    block?h("div",{className:"props"},[
      h("label",null,"Titre / consigne"),h("input",{value:block.title,onChange:e=>updateBlock(block.id,{title:e.target.value})}),
      h("label",null,"Texte"),h("textarea",{value:block.text,onChange:e=>updateBlock(block.id,{text:e.target.value})}),
      h("label",null,"Style du bloc"),h("select",{value:block.variant||"card",onChange:e=>updateBlock(block.id,{variant:e.target.value})},[
        h("option",{value:"card"},"Cartoon contour noir"),
        h("option",{value:"soft"},"Doux bleu"),
        h("option",{value:"glass"},"Verre moderne"),
        h("option",{value:"minimal"},"Minimal"),
        h("option",{value:"rule"},"Règle")
      ]),
      h("div",{className:"grid2"},[h("div",null,[h("label",null,"X"),h("input",{type:"number",value:block.x,onChange:e=>updateBlock(block.id,{x:+e.target.value})})]),h("div",null,[h("label",null,"Y"),h("input",{type:"number",value:block.y,onChange:e=>updateBlock(block.id,{y:+e.target.value})})])]),
      h("div",{className:"grid2"},[h("div",null,[h("label",null,"Largeur"),h("input",{type:"number",value:block.w,onChange:e=>updateBlock(block.id,{w:+e.target.value})})]),h("div",null,[h("label",null,"Hauteur"),h("input",{type:"number",value:block.h,onChange:e=>updateBlock(block.id,{h:+e.target.value})})])]),
      h("div",{className:"row",style:{marginTop:10}},[h("button",{className:"btn",onClick:duplicate},"Dupliquer"),h("button",{className:"btn danger",onClick:removeBlock},"Supprimer")])
    ]):h("p",{className:"small"},"Sélectionne un bloc sur la page."),
    h("h2",null,"Projet JSON"),
    h("textarea",{className:"json",value:json,onChange:e=>setJson(e.target.value)}),
    h("div",{className:"row",style:{marginTop:8}},[h("button",{className:"btn primary",onClick:()=>setJson(exportData())},"Exporter"),h("button",{className:"btn",onClick:()=>importData(json)},"Importer")])
  ]);
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
